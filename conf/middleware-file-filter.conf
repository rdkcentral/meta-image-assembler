# Feature-based File Filtering Configuration
# This file maps DISTRO_FEATURES to specific files that should be removed from installed packages
# Use this when an IPK contains files that should only be present if a feature is enabled

# Format:
# MIDDLEWARE_FILE_FILTER_<feature> = "required_distro_feature"
# MIDDLEWARE_FILE_FILTER_<feature>_FILES = "file patterns to remove if feature is disabled"

# Motion Detector files from entservices-peripherals
# Based on actual recipe: meta-rdk-video/recipes-extended/entservices/entservices-peripherals.bb
# PACKAGECONFIG[motiondetection] = "-DPLUGIN_MOTION_DETECTION=ON,..."
# Plugin installs to: ${libdir}/wpeframework/plugins/ and ${datadir}/WPEFramework/
# Only keep these files if motion_detector is in DISTRO_FEATURES
MIDDLEWARE_FILE_FILTER_motiondetector = "motion_detector"
MIDDLEWARE_FILE_FILTER_motiondetector_FILES = " \
    /usr/lib/wpeframework/plugins/libWPEFrameworkMotionDetection.so* \
    /etc/WPEFramework/plugins/MotionDetection.json \
    /usr/share/WPEFramework/MotionDetection/* \
"

# List all available file filter features
MIDDLEWARE_FILE_FILTER_FEATURES = " \
    motiondetector \
"
